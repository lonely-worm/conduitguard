
[project]
name = "conduitguard"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi[standard]==0.161.1",
    "pydantic==2.14.1",
    "uvicorn[standard]==0.54.0",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py315"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.fastapi]
entrypoint = "main:app"
